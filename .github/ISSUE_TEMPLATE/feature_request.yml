name: Feature request
description: Suggest an improvement or a new feature for Pasto.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Pasto keeps everything on your Mac and has no accounts or servers. Ideas that fit that are the easiest to
        take on; anything that would send clipboard contents off the Mac will not be.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How you imagine it working, from your point of view. Sketches or screenshots welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds you use now, or other ways it could work.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this has not been proposed yet.
          required: true
